name: Build Windows executable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Testar conversões com o ffmpeg empacotado
        run: python tests/smoke_test.py

      - name: Gerar StreamMate.exe
        run: pyinstaller script.spec --noconfirm --clean

      - name: Conferir o executável
        shell: pwsh
        run: |
          $exe = "dist/StreamMate.exe"
          if (!(Test-Path $exe)) { throw "StreamMate.exe não foi gerado" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "O app fechou sozinho (código $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: StreamMate-windows
          path: dist/StreamMate.exe

      - name: Anexar à release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/StreamMate.exe --clobber
